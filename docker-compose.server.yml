services:

  # ── PostgreSQL ────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${DB_PASSWORD:-studio123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ───────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    env_file: .env
    volumes:
      - media_data:/opt/studio/media
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker ─────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2 --queues=celery --max-tasks-per-child=100
    env_file: .env
    volumes:
      - media_data:/opt/studio/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker (gallery downloads — isolated so a slow/heavy
  #    download_keyword run can never starve render/publish/crawl tasks
  #    on the main worker, see task_routes in celery_app.py) ──────────
  worker-gallery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2 --queues=gallery --max-tasks-per-child=50
    env_file: .env
    volumes:
      - media_data:/opt/studio/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker (Mode 7 video — YouTube analysis + clip renders) ──
  #    One render at a time: an 83s captioned clip measured ~245s wall and
  #    ~700MB peak RSS (python + ffmpeg decoder + encoder) on 2 CPUs
  #    (2026-09-25). The box only has ~1.4GB free, so: a hard memory cap,
  #    and a raised OOM score so under host pressure the kernel kills THIS
  #    worker (its job is simply retried) rather than a production worker.
  #    Isolated for the same reason as worker-gallery. The long stop grace
  #    lets a deploy finish the in-flight render (acks_late re-queues it anyway).
  worker-video:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1 --queues=video --max-tasks-per-child=5
    env_file: .env
    volumes:
      - media_data:/opt/studio/media
      # private: section downloads, subtitle cache, transient cookies.txt —
      # never under media_data, which nginx serves publicly
      - yt_private:/var/lib/studio-yt
    cpus: 2
    mem_limit: 1500m
    oom_score_adj: 500
    stop_grace_period: 5m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Beat ───────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  # ── Design Renderer (headless Fabric.js) ──────
  renderer:
    build:
      context: ./renderer
      dockerfile: Dockerfile
    restart: always
    # no external port — only the worker/api call it on the compose network

  # ── Next.js Frontend ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://109.123.232.184/api}
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    depends_on:
      - api

  # ── Nginx ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - media_data:/opt/studio/media:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  redis_data:
  media_data:
  yt_private:
