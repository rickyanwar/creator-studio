name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # Private images in GHCR (visibility follows the private repo). The VPS only pulls.
  IMAGE_PREFIX: ghcr.io/rickyanwar/creator-studio

jobs:
  build:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    # Builds moved off the small VPS (2026-10-18): no build cache on the server any more.
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            build_args: ""
          - name: renderer
            context: ./renderer
            file: ./renderer/Dockerfile
            build_args: ""
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile.prod
            build_args: |
              NEXT_PUBLIC_API_URL=https://autostudio.pro/api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free runner disk (the backend image is ~6 GB unpacked)
        if: matrix.name == 'backend'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: false
          build-args: ${{ matrix.build_args }}
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:buildcache,mode=max

  deploy:
    name: SSH Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Short-lived job token: the VPS logs in to pull and logs out again; nothing is stored there.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 35m
          envs: GHCR_USER,GHCR_TOKEN,DEPLOY_SHA,IMAGE_PREFIX
          script: |
            set -euo pipefail

            echo "── Checking server repository status ──"
            cd /opt/studio
            if [ -n "$(git status --porcelain -uno)" ]; then
              echo "✗ Tracked server files dirty. Aborting deployment to avoid destroying work." >&2
              exit 1
            fi

            echo "── Pulling latest code ──"
            OLD_HEAD=$(git rev-parse HEAD)
            git pull origin main
            if ! git merge-base --is-ancestor "$DEPLOY_SHA" HEAD; then
              echo "✗ Server checkout does not contain $DEPLOY_SHA. Aborting." >&2
              exit 1
            fi

            DEPLOY_ID=$(date +%Y%m%d_%H%M%S)

            echo "── Recording rollback image tags for running services (deploy $DEPLOY_ID) ──"
            PREV_API_CID=$(docker compose -p studio -f docker-compose.server.yml ps -q api | head -n1 || true)
            PREV_RENDERER_CID=$(docker compose -p studio -f docker-compose.server.yml ps -q renderer | head -n1 || true)
            PREV_FRONTEND_CID=$(docker compose -p studio -f docker-compose.server.yml ps -q frontend | head -n1 || true)

            PREV_API_IMG=""
            PREV_RENDERER_IMG=""
            PREV_FRONTEND_IMG=""
            PREV_API_TAG="studio-backend:rollback-${DEPLOY_ID}"
            PREV_RENDERER_TAG="studio-renderer:rollback-${DEPLOY_ID}"
            PREV_FRONTEND_TAG="studio-frontend:rollback-${DEPLOY_ID}"

            PREV_API_TARGET="studio-backend:latest"
            PREV_RENDERER_TARGET="studio-renderer"
            PREV_FRONTEND_TARGET="studio-frontend"

            if [ -n "$PREV_API_CID" ]; then
              PREV_API_IMG=$(docker inspect -f '{{.Image}}' "$PREV_API_CID" 2>/dev/null || true)
              if [ -n "$PREV_API_IMG" ]; then
                docker tag "$PREV_API_IMG" "$PREV_API_TAG"
                echo "Saved api rollback tag $PREV_API_TAG ($PREV_API_IMG)"
              fi
            fi

            if [ -n "$PREV_RENDERER_CID" ]; then
              PREV_RENDERER_IMG=$(docker inspect -f '{{.Image}}' "$PREV_RENDERER_CID" 2>/dev/null || true)
              if [ -n "$PREV_RENDERER_IMG" ]; then
                docker tag "$PREV_RENDERER_IMG" "$PREV_RENDERER_TAG"
                echo "Saved renderer rollback tag $PREV_RENDERER_TAG ($PREV_RENDERER_IMG)"
              fi
            fi

            if [ -n "$PREV_FRONTEND_CID" ]; then
              PREV_FRONTEND_IMG=$(docker inspect -f '{{.Image}}' "$PREV_FRONTEND_CID" 2>/dev/null || true)
              if [ -n "$PREV_FRONTEND_IMG" ]; then
                docker tag "$PREV_FRONTEND_IMG" "$PREV_FRONTEND_TAG"
                echo "Saved frontend rollback tag $PREV_FRONTEND_TAG ($PREV_FRONTEND_IMG)"
              fi
            fi

            echo "── Pulling images built by GitHub Actions (sha $DEPLOY_SHA, max 15 min each) ──"
            if [ -z "${DEPLOY_SHA:-}" ] || [ -z "${IMAGE_PREFIX:-}" ]; then
              echo "✗ DEPLOY_SHA / IMAGE_PREFIX not set — nothing was restarted" >&2
              exit 1
            fi
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
            for img in backend renderer frontend; do
              ref="${IMAGE_PREFIX}/${img}:sha-${DEPLOY_SHA}"
              echo "· pulling $ref"
              if ! timeout 15m docker pull -q "$ref"; then
                docker logout ghcr.io >/dev/null 2>&1 || true
                echo "✗ pull of $img failed or took longer than 15 min — nothing was restarted" >&2
                exit 1
              fi
              rev=$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$ref")
              if [ "$rev" != "$DEPLOY_SHA" ]; then
                docker logout ghcr.io >/dev/null 2>&1 || true
                echo "✗ $img image is revision '$rev', expected $DEPLOY_SHA — nothing was restarted" >&2
                exit 1
              fi
            done
            docker logout ghcr.io >/dev/null 2>&1 || true
            # The compose services run these local names (api/workers/beat: studio-backend:latest).
            docker tag "${IMAGE_PREFIX}/backend:sha-${DEPLOY_SHA}" studio-backend:latest
            docker tag "${IMAGE_PREFIX}/renderer:sha-${DEPLOY_SHA}" studio-renderer:latest
            docker tag "${IMAGE_PREFIX}/frontend:sha-${DEPLOY_SHA}" studio-frontend:latest

            echo "── Pre-migration database backup ──"
            BACKUP_DIR="/var/backups/studio-social/${DEPLOY_ID}"
            mkdir -p "$BACKUP_DIR"
            chmod 700 "$BACKUP_DIR"
            (
              umask 077
              BACKUP_FILE="${BACKUP_DIR}/studio_pre_deploy_${DEPLOY_ID}.dump"
              docker compose -p studio -f docker-compose.server.yml exec -T db pg_dump -U studio -Fc studio > "$BACKUP_FILE"
              if [ ! -s "$BACKUP_FILE" ]; then
                echo "✗ Backup dump file is empty. Aborting migration." >&2
                exit 1
              fi
              if ! docker compose -p studio -f docker-compose.server.yml exec -T db pg_restore --list < "$BACKUP_FILE" > /dev/null; then
                echo "✗ Backup dump verification failed. Aborting migration." >&2
                exit 1
              fi
              echo "✓ Database backup verified nonempty and readable: $BACKUP_FILE"
            )

            echo "── Running database migrations (isolated run before container restart) ──"
            if ! docker compose -p studio -f docker-compose.server.yml run --rm --no-deps api alembic upgrade head; then
              echo "✗ Database migration failed. Aborting deploy without DB downgrade. Old containers remain running." >&2
              exit 1
            fi

            echo "── Verifying migration head ──"
            docker compose -p studio -f docker-compose.server.yml run --rm --no-deps api alembic current

            echo "── Restarting services ──"
            STARTUP_FAILED=false
            if ! docker compose -p studio -f docker-compose.server.yml up -d --remove-orphans --no-build; then
              echo "✗ Normal service startup failed." >&2
              STARTUP_FAILED=true
            fi

            if [ "$STARTUP_FAILED" = "false" ]; then
              echo "── Reloading nginx ──"
              if ! docker compose -p studio -f docker-compose.server.yml restart nginx; then
                echo "✗ Normal nginx reload failed." >&2
                STARTUP_FAILED=true
              fi
            fi

            echo "── Polling internal API and ingress health ──"
            HEALTH_OK=false
            if [ "$STARTUP_FAILED" = "false" ]; then
              for i in $(seq 1 20); do
                if docker compose -p studio -f docker-compose.server.yml exec -T api python -c "import urllib.request, sys; res = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); sys.exit(0 if res.getcode() == 200 else 1)" 2>/dev/null && \
                   curl -sSf --max-time 5 --resolve autostudio.pro:443:127.0.0.1 https://autostudio.pro/api/health >/dev/null 2>&1; then
                  HEALTH_OK=true
                  echo "✓ API and ingress health check passed on attempt $i"
                  break
                fi
                echo "· Waiting for API and ingress health (attempt $i/20)..."
                sleep 2
              done
            fi

            if [ "$STARTUP_FAILED" = "true" ] || [ "$HEALTH_OK" != "true" ]; then
              echo "✗ Startup or health check failed. Restoring rollback image tags and recreating application services..." >&2
              [ -n "$PREV_API_IMG" ] && docker tag "$PREV_API_TAG" "$PREV_API_TARGET"
              [ -n "$PREV_RENDERER_IMG" ] && docker tag "$PREV_RENDERER_TAG" "$PREV_RENDERER_TARGET"
              [ -n "$PREV_FRONTEND_IMG" ] && docker tag "$PREV_FRONTEND_TAG" "$PREV_FRONTEND_TARGET"

              APP_SERVICES="api worker worker-gallery worker-visual worker-video worker-delivery beat frontend renderer nginx"
              if ! docker compose -p studio -f docker-compose.server.yml up -d --no-deps --force-recreate --no-build $APP_SERVICES; then
                echo "✗ Rollback service recreation failed." >&2
                exit 1
              fi
              if ! docker compose -p studio -f docker-compose.server.yml restart nginx; then
                echo "✗ Rollback nginx restart failed." >&2
                exit 1
              fi

              echo "── Verifying rollback health ──"
              ROLLBACK_HEALTH_OK=false
              for i in $(seq 1 20); do
                if docker compose -p studio -f docker-compose.server.yml exec -T api python -c "import urllib.request, sys; res = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); sys.exit(0 if res.getcode() == 200 else 1)" 2>/dev/null && \
                   curl -sSf --max-time 5 --resolve autostudio.pro:443:127.0.0.1 https://autostudio.pro/api/health >/dev/null 2>&1; then
                  ROLLBACK_HEALTH_OK=true
                  echo "✓ Rollback health check passed on attempt $i"
                  break
                fi
                sleep 2
              done

              if [ "$ROLLBACK_HEALTH_OK" = "true" ]; then
                echo "✓ Service rollback healthy. Additive schema c21..c23 retained." >&2
              else
                echo "✗ Rollback health check failed. Manual intervention required." >&2
              fi
              echo "✗ Failing CI due to post-deploy health failure." >&2
              exit 1
            fi

            echo "── gflow-worker ──"
            if git diff --name-only "$OLD_HEAD" HEAD -- gflow_worker | grep -q .; then
              BUSY=$(docker compose -p studio -f docker-compose.server.yml exec -T api python -c "from app.database import SessionLocal; from app.models.ai_video import VideoJob; db = SessionLocal(); print(db.query(VideoJob).filter(VideoJob.status.in_(['claimed', 'generating'])).count())" | tail -1)
              if [ "$BUSY" = "0" ]; then
                systemctl restart gflow-worker && echo "gflow-worker restarted"
              else
                echo "! gflow-worker NOT restarted: $BUSY video job(s) running — restart it by hand later"
              fi
            else
              echo "gflow_worker unchanged — no restart"
            fi

            echo "── Verifying running containers are revision $DEPLOY_SHA ──"
            for svc in api worker worker-visual worker-delivery beat renderer frontend; do
              cid=$(docker compose -p studio -f docker-compose.server.yml ps -q "$svc" | head -n1)
              rev=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$cid" 2>/dev/null || true)
              if [ "$rev" != "$DEPLOY_SHA" ]; then
                echo "✗ $svc runs revision '$rev', expected $DEPLOY_SHA" >&2
                exit 1
              fi
            done
            echo "✓ All app containers run $DEPLOY_SHA"

            echo "── Keeping the 3 newest rollback deploys + 10 newest pre-deploy dumps ──"
            KEEP_IDS=$(docker images --format '{{.Tag}}' | grep '^rollback-' | sed 's/^rollback-//' | sort -u | tail -n 3 | paste -sd'|' -)
            if [ -n "$KEEP_IDS" ]; then
              docker images --format '{{.Repository}}:{{.Tag}}' | grep ':rollback-' | grep -vE "rollback-(${KEEP_IDS})$" | xargs -r docker rmi >/dev/null 2>&1 || true
            fi
            ls -1d /var/backups/studio-social/*/ 2>/dev/null | sort | head -n -10 | xargs -r rm -rf

            # Pulled sha tags of older deploys: their images stay reachable via the rollback tags above.
            docker images --format '{{.Repository}}:{{.Tag}}' | grep "^${IMAGE_PREFIX}/" | grep -v ":sha-${DEPLOY_SHA}$" | xargs -r docker rmi >/dev/null 2>&1 || true

            echo "── Pruning dangling images + all build cache (images are built in GitHub Actions) ──"
            docker image prune -f
            docker builder prune -af

            echo "✓ Deploy complete"
